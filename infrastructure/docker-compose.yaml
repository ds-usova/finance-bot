name: finance-bot-infrastructure

services:
  finance-postgres:
    image: pgvector/pgvector:pg18
    container_name: finance-bot-postgres
    command: [ "postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=1GB" ]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${FINANCE_BOT_DB}
      POSTGRES_USER: ${FINANCE_BOT_DB_USER}
      POSTGRES_PASSWORD: ${FINANCE_BOT_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      FINANCE_BOT_LEDGER_DB: ${FINANCE_BOT_LEDGER_DB}
      FINANCE_BOT_LEDGER_DB_USER: ${FINANCE_BOT_LEDGER_DB_USER}
      FINANCE_BOT_LEDGER_DB_PASSWORD: ${FINANCE_BOT_LEDGER_DB_PASSWORD}
      FINANCE_BOT_AI_DB: ${FINANCE_BOT_AI_DB}
      FINANCE_BOT_AI_DB_USER: ${FINANCE_BOT_AI_DB_USER}
      FINANCE_BOT_AI_DB_PASSWORD: ${FINANCE_BOT_AI_DB_PASSWORD}
    volumes:
      - finance-bot-postgres:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${FINANCE_BOT_DB_USER} -d ${FINANCE_BOT_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - backend

  ledger-service:
    build:
      context: ..
      dockerfile: ledger-service/Dockerfile
    container_name: finance-bot-ledger-service
    ports:
      - "1000:1000"
    environment:
      DB_JDBC_URL: jdbc:postgresql://finance-postgres:5432/${FINANCE_BOT_LEDGER_DB}
      DB_USER: ${FINANCE_BOT_LEDGER_DB_USER}
      DB_PASSWORD: ${FINANCE_BOT_LEDGER_DB_PASSWORD}
      AI_CONNECTOR_GRPC_TARGET: static://ai-connector-service:1001
      TELEGRAM_BOT_TOKEN: ${FINANCE_BOT_TELEGRAM_BOT_TOKEN}
      # The browser reaches the web app over the tunnel's HTTPS, so the session cookie must be Secure.
      WEB_SESSION_COOKIE_SECURE: ${FINANCE_BOT_WEB_SESSION_COOKIE_SECURE:-true}
      REDIS_URL: redis://redis:6379
      CDC_RECOVERY_SECRET: ${FINANCE_BOT_CDC_RECOVERY_SECRET}
      MANAGEMENT_PORT: 1010
    depends_on:
      finance-postgres:
        condition: service_healthy
    networks:
      - backend

  redis:
    image: redis:8
    container_name: finance-bot-redis
    volumes:
      - finance-bot-redis:/data
    networks:
      - backend

  ai-connector-service:
    build:
      context: ..
      dockerfile: ai-connector-service/Dockerfile
    container_name: finance-bot-ai-connector-service
    ports:
      - "1001:1001"
      - "1002:1002"
    environment:
      OPENAI_API_KEY: ${FINANCE_BOT_OPENAI_API_KEY}
      LEDGER_MCP_URL: http://ledger-service:1000
      DB_JDBC_URL: jdbc:postgresql://finance-postgres:5432/${FINANCE_BOT_AI_DB}
      DB_USER: ${FINANCE_BOT_AI_DB_USER}
      DB_PASSWORD: ${FINANCE_BOT_AI_DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      MANAGEMENT_PORT: 1011
    depends_on:
      finance-postgres:
        condition: service_healthy
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: finance-bot-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - finance-bot-prometheus:/prometheus
    depends_on:
      - ledger-service
      - ai-connector-service
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - backend

  grafana:
    image: grafana/grafana:13.1.3
    container_name: finance-bot-grafana
    ports:
      - "1005:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${FINANCE_BOT_GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${FINANCE_BOT_GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - finance-bot-grafana:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - backend

  web-app:
    build:
      context: ..
      dockerfile: web-app/Dockerfile
      args:
        VITE_TELEGRAM_BOT_USERNAME: ${FINANCE_BOT_TELEGRAM_BOT_USERNAME}
    container_name: finance-bot-web-app
    ports:
      - "1003:80"
    depends_on:
      - ledger-service
    networks:
      - backend

volumes:
  finance-bot-postgres:
    name: finance-bot-postgres
  finance-bot-redis:
    name: finance-bot-redis
  finance-bot-prometheus:
    name: finance-bot-prometheus
  finance-bot-grafana:
    name: finance-bot-grafana

networks:
  backend:
    name: finance-bot-backend
    driver: bridge
