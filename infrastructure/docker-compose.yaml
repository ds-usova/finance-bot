name: finance-bot-infrastructure

services:
  finance-postgres:
    image: postgres:18
    container_name: finance-bot-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${FINANCE_BOT_DB}
      POSTGRES_USER: ${FINANCE_BOT_DB_USER}
      POSTGRES_PASSWORD: ${FINANCE_BOT_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - finance-bot-postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${FINANCE_BOT_DB_USER} -d ${FINANCE_BOT_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - backend

  ledger-service:
    build:
      context: ..
      dockerfile: ledger-service/Dockerfile
    container_name: finance-bot-ledger-service
    ports:
      - "1000:1000"
    environment:
      DB_JDBC_URL: jdbc:postgresql://finance-postgres:5432/${FINANCE_BOT_DB}
      DB_USER: ${FINANCE_BOT_DB_USER}
      DB_PASSWORD: ${FINANCE_BOT_DB_PASSWORD}
      AI_CONNECTOR_GRPC_TARGET: static://ai-connector-service:1001
    depends_on:
      finance-postgres:
        condition: service_healthy
    networks:
      - backend

  ai-connector-service:
    build:
      context: ..
      dockerfile: ai-connector-service/Dockerfile
    container_name: finance-bot-ai-connector-service
    ports:
      - "1001:1001"
      - "1002:1002"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    networks:
      - backend

volumes:
  finance-bot-postgres:
    name: finance-bot-postgres

networks:
  backend:
    name: finance-bot-backend
    driver: bridge
