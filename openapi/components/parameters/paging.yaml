Limit:
  name: limit
  in: query
  required: false
  description: >-
    The page size. Refused with 400 naming `limit` and the bound it broke when it is below 1, above 100, or not a
    number.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 50
  example: 20

Offset:
  name: offset
  in: query
  required: false
  description: >-
    How many matching rows to skip. Refused with 400 naming `offset` when it is negative or not a number.
  schema:
    type: integer
    minimum: 0
    default: 0
  example: 40
