get:
  operationId: listCategories
  tags:
    - categories
  parameters:
    - name: groupingId
      in: query
      required: false
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Every category, unpaged.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas/category.yaml#/Category'
    '400':
      $ref: '../components/responses/errors.yaml#/BadRequest'
    '401':
      $ref: '../components/responses/errors.yaml#/Unauthorized'
    '404':
      description: The session names no user row.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/problem.yaml#/Problem'
    '503':
      $ref: '../components/responses/errors.yaml#/ServiceUnavailable'
