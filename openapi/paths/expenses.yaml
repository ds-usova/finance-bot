get:
  operationId: listExpenses
  summary: List one page of the signed-in person's recorded expenses and pending proposals.
  description: >-
    Every parameter is optional and each narrows on its own. The listing is scoped to the signed-in person: no
    parameter widens it, and none names whose ledger it is.
  tags:
    - expenses
  parameters:
    - $ref: '../components/parameters/paging.yaml#/Limit'
    - $ref: '../components/parameters/paging.yaml#/Offset'
    - $ref: '../components/parameters/expense-filters.yaml#/StatusFilter'
    - $ref: '../components/parameters/expense-filters.yaml#/CategoryIdFilter'
    - $ref: '../components/parameters/expense-filters.yaml#/FromFilter'
    - $ref: '../components/parameters/expense-filters.yaml#/ToFilter'
  responses:
    '200':
      description: A page of expenses, newest first.
      content:
        application/json:
          schema:
            $ref: '../ledger-api.yaml#/components/schemas/ExpensePage'
    '400':
      $ref: '../components/responses/errors.yaml#/BadRequest'
    '401':
      $ref: '../components/responses/errors.yaml#/Unauthorized'
    '404':
      $ref: '../components/responses/errors.yaml#/NotFound'
    '503':
      $ref: '../components/responses/errors.yaml#/ServiceUnavailable'
