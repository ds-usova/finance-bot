patch:
  operationId: changeExpenseCategory
  summary: Refile one of the signed-in person's entries under a different category.
  description: >-
    The entry is named by its id alone: since ADR 0018 an id is unique across both statuses, so the id and the
    signed-in caller name the row on their own. The document replaces `/categoryId` and nothing else, and the
    answer is the entry as it now stands. Both a pending proposal and a recorded expense can be refiled.
  tags:
    - expenses
  parameters:
    - name: id
      in: path
      required: true
      description: The id of the caller's entry, unique across both statuses.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 12
  requestBody:
    required: true
    content:
      application/json-patch+json:
        schema:
          $ref: '../ledger-api.yaml#/components/schemas/CategoryPatch'
  responses:
    '200':
      description: >-
        The entry was refiled, and is answered as it now stands. Answered for a category the entry already
        carried too; the day it appeared on is unchanged.
      content:
        application/json:
          schema:
            $ref: '../ledger-api.yaml#/components/schemas/Expense'
    '400':
      description: >-
        The document is not one `replace` of `/categoryId`, its value is below 1, the body is not JSON, or
        `categoryId` names no category of the caller's. The message names what was refused. Unlike every other
        refusal on this API, a row is read before this one: an unknown category, a grouping and another person's
        category are one answer.
      content:
        application/json:
          schema:
            $ref: '../ledger-api.yaml#/components/schemas/Problem'
          example:
            message: categoryId must name one of your own categories
    '401':
      $ref: '../components/responses/errors.yaml#/Unauthorized'
    '403':
      description: The request carried no CSRF token.
    '404':
      description: >-
        No entry of the caller's carries that id, or the session outlives the user row it names. The two carry
        different messages: one names the entry, the other says the caller is unknown.
      content:
        application/json:
          schema:
            $ref: '../ledger-api.yaml#/components/schemas/Problem'
          example:
            message: no entry of yours carries that id
    '503':
      $ref: '../components/responses/errors.yaml#/ServiceUnavailable'
