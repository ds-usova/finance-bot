<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance Bot</title>
    <script>
      // Duplicates theme.ts's resolveTheme in plain script form, run before React mounts so a person whose
      // choice is dark never sees a light frame first. A module import here would be deferred and paint late.
      (function () {
        var dark = false;
        try {
          var stored = localStorage.getItem('finance-bot-theme');
          dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        } catch {
          dark = matchMedia('(prefers-color-scheme: dark)').matches;
        }
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
