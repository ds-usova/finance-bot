server:
  port: 1002

spring:
  application:
    name: ai-connector-service
  threads:
    virtual:
      enabled: true
  grpc:
    server:
      port: 1001
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/finance_ai}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  data:
    jdbc:
      dialect: postgresql
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s
  flyway:
    enabled: ${memory.enabled}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      chat:
        model: ${OPENAI_MODEL:gpt-4o-mini}
        temperature: 0
    mcp:
      client:
        name: ai-connector-service
        version: 1.0.0
        initialized: false
        request-timeout: 5s
        streamable-http:
          connections:
            ledger:
              url: ${LEDGER_MCP_URL:http://localhost:1000}
              endpoint: /mcp

ai:
  expense:
    system-prompt: classpath:prompts/record-expenses.st
    user-message-template: classpath:prompts/user-message.st

memory:
  enabled: ${MEMORY_ENABLED:true}
  max-age: ${MEMORY_MAX_AGE:365d}
  purge-interval: ${MEMORY_PURGE_INTERVAL:1d}
  purge-batch: ${MEMORY_PURGE_BATCH:1000}
  entry-attempts: ${MEMORY_ENTRY_ATTEMPTS:3}

ledger:
  token:
    issuer: ${LEDGER_TOKEN_ISSUER:ledger-service}
    audience: ${LEDGER_TOKEN_AUDIENCE:mcp-adapter}
    jwks-timeout: ${LEDGER_JWKS_TIMEOUT:3s}
    jwks-uri: ${spring.ai.mcp.client.streamable-http.connections.ledger.url}/.well-known/jwks.json
  change-stream:
    key: ${CDC_STREAM_KEY:ledger.cdc}
    claim-idle: 30s

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState, ping
        readiness:
          include: readinessState
  health:
    db:
      enabled: ${memory.enabled}
    redis:
      enabled: ${memory.enabled}
