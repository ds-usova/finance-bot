plugins {
    id "java"
    id "jacoco"
    id "com.diffplug.spotless" version "$spotlessVersion"
    id "org.springframework.boot" version "$springBootVersion"
    id "io.spring.dependency-management" version "$springDependencyManagementVersion"
    id "com.google.protobuf" version "$protobufGradlePluginVersion"
    id "org.openapi.generator" version "$openApiGeneratorVersion"
}

group = "bot.finance"
version = "${appVersion}"
description = "ledger-service"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

def openApiOutputDir = layout.buildDirectory.dir("generated/sources/openapi")

sourceSets {
    main {
        proto {
            srcDir("$rootDir/../proto")
        }
        java {
            srcDir(openApiOutputDir.map { it.dir("src/main/java") })
        }
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all().configureEach {
            plugins {
                grpc {}
            }
        }
    }
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$rootDir/../openapi/ledger-api.yaml"
    outputDir = openApiOutputDir
    apiPackage = "bot.finance.api"
    modelPackage = "bot.finance.api.model"
    configOptions = [
        interfaceOnly: "true",
        useTags: "true"
    ]
}

tasks.named("compileJava") {
    dependsOn tasks.named("openApiGenerate")
}

dependencies {
    implementation platform("org.springframework.ai:spring-ai-bom:${springAiVersion}")
    implementation "org.springframework.ai:spring-ai-starter-mcp-server-webmvc"

    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-data-jdbc"
    implementation "org.springframework.boot:spring-boot-starter-flyway"
    implementation "org.springframework.boot:spring-boot-starter-jdbc"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.springframework.boot:spring-boot-starter-oauth2-resource-server"
    implementation "org.springframework.boot:spring-boot-starter-webmvc"
    implementation "org.springframework.boot:spring-boot-starter-webflux"

    implementation "io.swagger.core.v3:swagger-annotations:${swaggerAnnotationsVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"
    implementation "org.openapitools:jackson-databind-nullable:${jacksonDatabindNullableVersion}"

    // Database
    implementation "org.flywaydb:flyway-database-postgresql"
    implementation "org.postgresql:postgresql"

    // Change data capture
    implementation "io.debezium:debezium-embedded:${debeziumVersion}"
    implementation "io.debezium:debezium-connector-postgres:${debeziumVersion}"
    implementation "io.debezium:debezium-storage-jdbc:${debeziumVersion}"
    implementation "org.springframework.boot:spring-boot-starter-data-redis"
    implementation "io.micrometer:micrometer-registry-prometheus"

    // Telegram Bot API
    implementation "com.github.pengrad:java-telegram-bot-api:${pengradTelegramBotApiVersion}"

    implementation "org.springframework.boot:spring-boot-starter-grpc-client"
    implementation "io.grpc:grpc-services"

    testImplementation "io.grpc:grpc-testing"

    testImplementation "org.springframework.boot:spring-boot-starter-actuator-test"
    testImplementation "org.springframework.boot:spring-boot-starter-data-jdbc-test"
    testImplementation "org.springframework.boot:spring-boot-starter-flyway-test"
    testImplementation "org.springframework.boot:spring-boot-starter-jdbc-test"
    testImplementation "org.springframework.boot:spring-boot-starter-security-test"
    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
    testImplementation "org.springframework.boot:spring-boot-testcontainers"

    testImplementation "io.rest-assured:rest-assured:${restAssuredVersion}"
    testImplementation "io.rest-assured:json-path:${restAssuredVersion}"

    testImplementation "org.testcontainers:testcontainers-junit-jupiter"
    testImplementation "org.testcontainers:testcontainers-postgresql"
    testImplementation "org.testcontainers:testcontainers-toxiproxy"

    testImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"
    testImplementation "org.awaitility:awaitility:${awaitilityVersion}"
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"

    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Keeps every Kafka Connect artifact debezium-embedded pulls in on the version it was built against (see the
// comment on kafkaConnectVersion in gradle.properties) instead of the newer one Spring Boot's own dependency
// management would otherwise select for it.
dependencyManagement {
    dependencies {
        dependency "org.apache.kafka:connect-api:${kafkaConnectVersion}"
        dependency "org.apache.kafka:connect-runtime:${kafkaConnectVersion}"
        dependency "org.apache.kafka:connect-json:${kafkaConnectVersion}"
        dependency "org.apache.kafka:connect-file:${kafkaConnectVersion}"
        dependency "org.apache.kafka:connect-transforms:${kafkaConnectVersion}"
        dependency "org.apache.kafka:kafka-clients:${kafkaConnectVersion}"
    }
}

test {
    useJUnitPlatform()

    // A developer's shell may export a real TELEGRAM_BOT_TOKEN for running the bot locally. Spring Boot's
    // environment-variable property source outranks the "test" profile's own application-test.yaml, so an
    // inherited value would silently replace the fixed token the test profile declares. Strip it from the
    // forked test JVM so the profile's own default always wins, the way the test suite assumes it does.
    environment.remove("TELEGRAM_BOT_TOKEN")
}

jacoco {
    toolVersion = "${jacocoVersion}"
}

// Generated protobuf and gRPC stubs compile into main output and are never exercised directly.
// The report and the rule share one filter, so a reported percentage is the one being enforced.
def coveredClasses = { task ->
    task.classDirectories.setFrom(files(task.classDirectories.files.collect {
        fileTree(dir: it, exclude: ["bot/finance/ai/adapter/grpc/v1/**", "bot/finance/api/**", "**/*Application.class"])
    }))
}

tasks.named("jacocoTestReport") {
    coveredClasses(it)

    // CSV is what tools/plan-evidence reads: one row per class, no XML parsing in a shell script.
    reports {
        csv.required = true
        html.required = true
    }
}

// Deliberately not wired into `test` or `check`: a filtered run and a half-implemented plan both
// have every right to low coverage. tools/agent-test/agent-test.sh --coverage names this task.
tasks.named("jacocoTestCoverageVerification") {
    dependsOn tasks.named("test")
    coveredClasses(it)

    violationRules {
        rule {
            limit {
                counter = "INSTRUCTION"
                minimum = coverageMinimum.toBigDecimal()
            }
        }
    }
}

spotless {
    java {
        target "src/main/java/**/*.java", "src/test/java/**/*.java"
        palantirJavaFormat("${palantirJavaFormatVersion}")
        removeUnusedImports()
        importOrder()
    }
}
