server:
  port: 1000

spring:
  application:
    name: ledger-service
  threads:
    virtual:
      enabled: true
  ai:
    mcp:
      server:
        enabled: ${MCP_ENABLED:true}
        name: ledger-service
        version: 1.0.0
        protocol: STATELESS
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/ledger-db}
    username: ${DB_USER:ledger-user}
    password: ${DB_PASSWORD:ledger-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-init-sql: "SET TIME ZONE 'UTC'"
  data:
    jdbc:
      dialect: postgresql
  flyway:
    enabled: true
    locations: classpath:db/migration
  grpc:
    client:
      channel:
        ai-connector:
          target: ${AI_CONNECTOR_GRPC_TARGET:static://localhost:1001}
          default:
            deadline: 10s

mcp:
  token:
    keystore: ${MCP_JWT_KEYSTORE:classpath:local-mcp-signing.p12}
    keystore-password: ${MCP_JWT_KEYSTORE_PASSWORD:changeit}
    key-alias: ${MCP_JWT_KEY_ALIAS:mcp-signing}
    issuer: ledger-service
    audience: mcp-adapter
    ttl: ${MCP_JWT_TTL:2m}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    api-url: ${TELEGRAM_API_URL:https://api.telegram.org/bot}
    polling:
      enabled: ${TELEGRAM_POLLING_ENABLED:true}
      limit: 100
      timeout-seconds: 30
      sleep-millis: 100

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState, ping
        readiness:
          include: readinessState
