server:
  port: 1000

spring:
  application:
    name: ledger-service
  threads:
    virtual:
      enabled: true
  ai:
    mcp:
      server:
        enabled: ${MCP_ENABLED:true}
        name: ledger-service
        version: 1.0.0
        protocol: STATELESS
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/ledger-db}
    username: ${DB_USER:ledger-user}
    password: ${DB_PASSWORD:ledger-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-init-sql: "SET TIME ZONE 'UTC'"
  data:
    jdbc:
      dialect: postgresql
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
  flyway:
    enabled: true
    locations: classpath:db/migration
  grpc:
    client:
      channel:
        ai-connector:
          target: ${AI_CONNECTOR_GRPC_TARGET:static://localhost:1001}
          default:
            deadline: 60s

token:
  signing:
    keystore: ${TOKEN_SIGNING_KEYSTORE:classpath:local-mcp-signing.p12}
    keystore-password: ${TOKEN_SIGNING_KEYSTORE_PASSWORD:changeit}
    key-alias: ${TOKEN_SIGNING_KEY_ALIAS:mcp-signing}

mcp:
  token:
    issuer: ledger-service
    audience: mcp-adapter
    ttl: ${MCP_JWT_TTL:2m}

session:
  token:
    issuer: ledger-service
    audience: web-app
    ttl: ${SESSION_JWT_TTL:7d}

web:
  session:
    cookie-name: ${WEB_SESSION_COOKIE_NAME:fb_session}
    secure: ${WEB_SESSION_COOKIE_SECURE:false}
    same-site: ${WEB_SESSION_COOKIE_SAME_SITE:Lax}
    path: /

report-clearing:
  pool:
    core-size: ${REPORT_CLEARING_POOL_CORE_SIZE:1}
    max-size: ${REPORT_CLEARING_POOL_MAX_SIZE:2}
    queue-capacity: ${REPORT_CLEARING_POOL_QUEUE_CAPACITY:100}

cdc:
  enabled: ${CDC_ENABLED:true}
  slot-name: ${CDC_SLOT_NAME:finance_ledger_cdc}
  stream-key: ${CDC_STREAM_KEY:ledger.cdc}
  stream-max-length: ${CDC_STREAM_MAX_LENGTH:100000}
  snapshot-mode: ${CDC_SNAPSHOT_MODE:no_data}
  heartbeat-interval: ${CDC_HEARTBEAT_INTERVAL:30s}
  slot-monitor-interval: ${CDC_SLOT_MONITOR_INTERVAL:30s}
  category-cache-size: ${CDC_CATEGORY_CACHE_SIZE:50000}
  recovery-secret: ${CDC_RECOVERY_SECRET}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    api-url: ${TELEGRAM_API_URL:https://api.telegram.org/bot}
    polling:
      enabled: ${TELEGRAM_POLLING_ENABLED:true}
      limit: 100
      timeout-seconds: 30
      sleep-millis: 100
  login:
    max-age: ${TELEGRAM_LOGIN_MAX_AGE:1d}

management:
  server:
    port: ${MANAGEMENT_PORT:1010}
  endpoints:
    web:
      exposure:
        include: "*"
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    prometheus:
      access: unrestricted
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState, ping
        readiness:
          include: readinessState
